version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '15:00'
      timezone: America/Anchorage
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
      build-tooling:
        patterns:
          - vite
          - vinext
          - '@vitejs/*'
          - '@cloudflare/*'
          - wrangler

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
